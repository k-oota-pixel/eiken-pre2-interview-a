name: Install 20 individual PNG images

on:
  push:
    branches:
      - png-assets
    paths:
      - image_payload.ready

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: png-assets
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Rebuild four image strips and create 20 PNG files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/strips images
          for n in 1 2 3 4; do
            cat image_payload_parts/strip${n}.* > /tmp/strip${n}.b64
            base64 -d /tmp/strip${n}.b64 > /tmp/strips/strip${n}.webp
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path('images')
          q = 1
          for strip_no in range(1, 5):
              im = Image.open(f'/tmp/strips/strip{strip_no}.webp').convert('RGB')
              if im.width % 5:
                  raise RuntimeError(f'Unexpected strip width: {im.width}')
              cell_w = im.width // 5
              for col in range(5):
                  cell = im.crop((col * cell_w, 0, (col + 1) * cell_w, im.height))
                  target = out / f'{q:02d}.png'
                  cell.save(target, 'PNG', optimize=True)
                  print(target, cell.size)
                  q += 1
          if q != 21:
              raise RuntimeError('Did not create all 20 PNG files')
          PY
          sed -i 's/\.webp`/\.png`/' app.js
          sed -i '/<script src="sprite.js"><\/script>/d' index.html
          rm -f sprite.js images/strip1.webp images/strip2.webp images/strip3.webp images/strip4.webp
          rm -rf image_payload_parts image_payload.ready convert_sprites.ready asset_chunks
      - name: Commit and publish to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use 20 individual PNG images"
          git push origin HEAD:main
