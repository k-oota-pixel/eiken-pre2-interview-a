name: Convert question images to individual PNGs

on:
  push:
    paths:
      - convert_sprites.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Split strips into 20 PNG files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          images = Path('images')
          out_id = 1
          for strip_no in range(1, 5):
              path = images / f'strip{strip_no}.webp'
              im = Image.open(path).convert('RGB')
              w, h = im.size
              if w % 5 != 0:
                  raise RuntimeError(f'{path}: width {w} is not divisible by 5')
              cell_w = w // 5
              print(f'{path}: {w}x{h}, each question {cell_w}x{h}')
              for col in range(5):
                  crop = im.crop((col * cell_w, 0, (col + 1) * cell_w, h))
                  target = images / f'{out_id:02d}.png'
                  crop.save(target, 'PNG', optimize=True)
                  print(f'created {target} {crop.size[0]}x{crop.size[1]}')
                  out_id += 1
          assert out_id == 21
          PY

          sed -i 's/\.webp`/\.png`/' app.js
          sed -i '/<script src="sprite.js"><\/script>/d' index.html
          rm -f sprite.js images/strip1.webp images/strip2.webp images/strip3.webp images/strip4.webp convert_sprites.ready
      - name: Commit individual PNG files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace image sprites with 20 individual PNG files"
          git push
