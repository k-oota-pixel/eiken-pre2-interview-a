name: Install 20 individual PNG images

on:
  push:
    branches:
      - png-assets
    paths:
      - image_payload.ready

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: png-assets
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build individual PNG files
        shell: bash
        run: |
          set -euo pipefail
          cat image_payload_parts/chunk-* > /tmp/images.b64
          base64 -d /tmp/images.b64 > /tmp/images.tar.gz
          mkdir -p /tmp/jpgs images
          tar -xzf /tmp/images.tar.gz -C /tmp/jpgs
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path('/tmp/jpgs')
          target = Path('images')
          target.mkdir(exist_ok=True)
          for n in range(1, 21):
              src = source / f'{n:02d}.jpg'
              if not src.exists():
                  raise RuntimeError(f'Missing {src}')
              im = Image.open(src).convert('RGB')
              out = target / f'{n:02d}.png'
              im.save(out, 'PNG', optimize=True)
              print(f'{out}: {im.size[0]}x{im.size[1]}')
          PY
          sed -i 's/\.webp`/\.png`/' app.js
          sed -i '/<script src="sprite.js"><\/script>/d' index.html
          rm -f sprite.js images/strip1.webp images/strip2.webp images/strip3.webp images/strip4.webp
          rm -rf image_payload_parts image_payload.ready convert_sprites.ready
      - name: Commit and publish to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use 20 individual PNG images"
          git push origin HEAD:main
