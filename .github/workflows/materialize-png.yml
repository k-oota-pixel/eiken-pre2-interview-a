name: Materialize individual PNGs

on:
  push:
    paths:
      - '.github/workflows/materialize-png.yml'

permissions:
  contents: write

jobs:
  split-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Split four strips into 20 PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          out = Path('images')
          out.mkdir(exist_ok=True)
          q = 1
          for strip_no in range(1, 5):
              src = out / f'strip{strip_no}.webp'
              im = Image.open(src).convert('RGB')
              if im.width % 5 != 0:
                  raise RuntimeError(f'{src}: width {im.width} is not divisible by 5')
              cell_w = im.width // 5
              for col in range(5):
                  cell = im.crop((col * cell_w, 0, (col + 1) * cell_w, im.height))
                  cell.save(out / f'{q:02d}.png', format='PNG', optimize=True)
                  q += 1
          print('created', q - 1, 'PNG files')
          PY

      - name: Commit PNG files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/??.png
          git diff --cached --quiet && exit 0
          git commit -m 'Add individual PNG illustrations'
          git push origin HEAD:main
